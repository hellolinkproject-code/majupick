# WorkBridge 최소 CI — push/PR에서 lint·format·unit·build·DB 통합을 검사한다.
# GitHub에 업로드·Actions 실행은 STEP 12-B(사용자 승인) 이후다. 이 파일만 로컬에 준비한다.
name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · format · unit · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate -w apps/api

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: Unit tests (no DB)
        run: npm run test

      - name: Production build
        run: npm run build

      # Node 래퍼가 Windows powershell / Linux pwsh를 선택한다(검사 로직은 동일 .ps1).
      - name: API script static checks
        run: npm run test:scripts -w apps/api

  db-integration:
    name: DB integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          # 이미지 초기 계정만 superuser다. 테스트 계정은 이후 단계에서 만든다.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workbridge_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 테스트 런타임 유지. DATABASE_URL은 가드 검증용으로만 두고 연결하지 않는다.
      # prisma generate(pretest)는 optional 개발 URL로 null을 허용한다(database.js).
      # 비밀번호는 이 일회용 CI 컨테이너 전용 값이다.
      NODE_ENV: test
      DATABASE_URL: postgresql://workbridge_app:workbridge_ci@localhost:5432/workbridge_dev
      TEST_DATABASE_URL: postgresql://workbridge_app:workbridge_ci@localhost:5432/workbridge_test
      SHADOW_DATABASE_URL: postgresql://workbridge_app:workbridge_ci@localhost:5432/workbridge_shadow
      ALLOW_REMOTE_DATABASE: 'false'
      JWT_ACCESS_SECRET: ci-test-jwt-access-secret-at-least-32-chars
      PG_MODE: mock
      TOSS_ENABLE_TEST_CALLS: 'false'
      AI_ESTIMATE_MODE: mock
      AI_ENABLE_BILLABLE_CALLS: 'false'
      AI_ESTIMATE_MONTHLY_BUDGET_USD: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 서비스 healthcheck 이후: 비관리자 계정, 테스트 DB 소유권, timezone=UTC, 새 세션 검증.
      # 관리자 비밀번호는 이 단계에만 둔다. migrate와 테스트는 TEST_DATABASE_URL만 사용한다.
      - name: Provision non-superuser test database
        env:
          WORKBRIDGE_CI_PROVISION: 'true'
          CI_POSTGRES_PASSWORD: workbridge_ci
          CI_APP_PASSWORD: workbridge_ci
        run: node apps/api/scripts/provision-ci-database.js

      - name: Generate Prisma Client
        run: npm run db:generate -w apps/api

      # 실제 migrate·테스트는 TEST_DATABASE_URL(workbridge_test)만 사용한다.
      - name: Migrate test database
        run: npm run db:migrate:test -w apps/api

      - name: DB integration tests
        run: npm run test:db
